[package]
name = "enso-sys"
description = "Direct system interfaces for the enso suite: /sys, iwd, BlueZ, logind, dconf, PipeWire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
zbus = { workspace = true, optional = true }
pulseaudio = { workspace = true, optional = true }

[features]
# The `/sys` readers need nothing. Each D-Bus backend is opt-in, so a tool
# only links a D-Bus client if it talks to one of these services.
# Wi-Fi, through iwd.
iwd = ["dep:zbus"]
# Bluetooth, through BlueZ.
bluez = ["dep:zbus"]
# Screen and keyboard brightness without root, through logind.
logind = ["dep:zbus"]
# Desktop settings (the dark-or-light preference), through dconf.
dconf = ["dep:zbus"]
# Restarting a user service that reads its settings only at start, through systemd.
systemd = ["dep:zbus"]
# Disks, partitions, and USB sticks: listing, mounting, ejecting, through udisks2.
udisks = ["dep:zbus"]
# Keeping secrets in the session's keyring, through the Secret Service.
secrets = ["dep:zbus"]
# Volume, per output and per application, through PipeWire's PulseAudio socket.
audio = ["dep:pulseaudio"]

[lints]
workspace = true
