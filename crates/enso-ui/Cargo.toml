[package]
name = "enso-ui"
description = "Shared layer-shell runtime, software canvas, and text for the enso desktop suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
enso-core.workspace = true
# The scene behind the ensō on the login screen and the boot's last frame.
enso-scene = { workspace = true, features = ["render"] }
smithay-client-toolkit.workspace = true
calloop.workspace = true
kbvm.workspace = true
tiny-skia.workspace = true
cosmic-text.workspace = true
rustix.workspace = true
zeroize.workspace = true
# Which screen has the focus: where an overlay card opens (emerge).
niri-ipc.workspace = true
enso-fs = { workspace = true, optional = true }

[features]
# PNG export of offscreen renders, for snapshot tests.
png = ["tiny-skia/png-format"]
# Opening wallpapers: PNG, JPEG, WebP, and GIF files, decoded in pure Rust
# by enso-fs, as the file manager's thumbnails are.
picture = ["dep:enso-fs"]

[lints]
workspace = true
