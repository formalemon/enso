version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
enso-core.workspace = true
# Picture: decoding the PNG and JPEG files that wallpapers are.
enso-ui = { workspace = true, features = ["picture"] }
lexopt.workspace = true

[dev-dependencies]
enso-ui = { workspace = true, features = ["picture", "png"] }

