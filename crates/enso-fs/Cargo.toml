[package]
name = "enso-fs"
description = "Files without a window: listing, sorting, MIME types, applications, search, and the freedesktop specs, for the enso desktop suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rustix.workspace = true
jiff.workspace = true
png.workspace = true
image-webp.workspace = true
gif.workspace = true
zune-jpeg.workspace = true
zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
bzip2-rs = { workspace = true, optional = true }

[features]
# Reading, extracting, and making archives; the file manager's, not the
# launcher's.
archives = ["dep:zip", "dep:tar", "dep:flate2", "dep:lzma-rs", "dep:ruzstd", "dep:bzip2-rs"]

[lints]
workspace = true
