[package]
name = "enso-notify"
description = "Pure-Rust Freedesktop notification daemon with gliding toasts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
enso-core.workspace = true
enso-ui.workspace = true
# Pictures that notifications name by file: PNG, JPEG, WebP, GIF.
enso-fs.workspace = true
# The battery, read from /sys for the low-battery warnings; and logind, for
# their "Sleep now".
enso-sys = { workspace = true, features = ["logind"] }
serde.workspace = true
# The history, kept across restarts.
toml.workspace = true
lexopt.workspace = true
zbus.workspace = true

[dev-dependencies]
enso-ui = { workspace = true, features = ["png"] }

[lints]
workspace = true
