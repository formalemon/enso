[package]
name = "enso-ctl"
description = "Control center GUI and CLI: Wi-Fi, Bluetooth, sound, brightness, power, and theming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
enso-core.workspace = true
enso-sys = { workspace = true, features = ["iwd", "bluez", "logind", "audio", "dconf", "systemd", "notify"] }
enso-ui.workspace = true
serde.workspace = true
lexopt.workspace = true
# Reading a Wi-Fi passphrase from the terminal without echoing it.
rustix = { workspace = true, features = ["termios"] }
zeroize.workspace = true
# Picking a colour from the screen.
niri-ipc.workspace = true
# "Until 15:30": when Do not disturb, or keeping awake, ends.
jiff.workspace = true

[dev-dependencies]
enso-ui = { workspace = true, features = ["png"] }

[lints]
workspace = true
