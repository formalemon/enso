[package]
name = "enso-files"
description = "A file picker for every application, behind the desktop portal, and the file manager that comes with it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
enso-core.workspace = true
enso-fs = { workspace = true, features = ["archives"] }
enso-ui.workspace = true
serde.workspace = true
toml.workspace = true
lexopt.workspace = true
jiff.workspace = true
# Searching inside files, and bulk rename.
regex.workspace = true
# The desktop portal's file chooser, served on the session bus.
zbus.workspace = true
# Ending a picker the portal takes away.
rustix.workspace = true
# Restarting the portal after `portal enable`/`disable`.
enso-sys = { workspace = true, features = ["systemd", "udisks"] }

[dev-dependencies]
enso-ui = { workspace = true, features = ["png"] }

[lints]
workspace = true
