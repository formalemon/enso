# enso — example configuration
#
# Copy to ~/.config/enso/config.toml and change what you like.
# Every key is optional; the values below are the defaults.

# Theme used until one is chosen with `enso-ctl theme set <id>`.
# Built in: rose-pine-moon, rose-pine-main, rose-pine-dawn.
# Your own themes go in ~/.config/enso/themes/<id>.toml.
theme = "rose-pine-moon"

[appearance]
# Palette role used for active indicators and focus:
# love, gold, rose, pine, foam, or iris.
accent = "rose"
# Interface font family ("sans-serif" picks a sensible installed one).
font = "sans-serif"
# Monospaced font family, for the terminal and code ("monospace" likewise).
# A family named in either is also given to GTK and fontconfig by
# `enso-ctl theme apply` (the "fonts" theme target), so every program agrees.
mono_font = "monospace"
# Base text size in logical pixels.
font_size = 14.0
# "auto" draws icons (enso draws its own: no icon font is needed); "text"
# puts a few letters in their place. "glyphs" is the same as "auto".
icons = "auto"
# Pointer cursor: an XCursor theme by its directory name, as installed in
# ~/.local/share/icons or /usr/share/icons ("Bibata-Modern-Ice", "Adwaita").
# `enso-ctl theme apply` takes it to Niri, GTK, and every other program; ""
# leaves cursors alone. `enso-ctl cursor set` chooses one without editing this.
cursor = ""
# Cursor size in logical pixels.
cursor_size = 24
# Terminal emulator for programs that need one, run as `<terminal> -e <command>`
# (opening a terminal here, terminal applications, editing names in $EDITOR).
# "" uses $TERMINAL, or else alacritty.
terminal = ""

[motion]
# false makes every transition instant.
enabled = true
# Duration multiplier: 2.0 is twice as slow, 0.5 twice as fast.
speed = 1.0

[bar]
height = 36
# "top" or "bottom"
position = "top"
# strftime format
clock = "%a %-d %b  %H:%M"
# Open the control center (enso-ctl, when installed) under the status island
# while the pointer rests on it.
control_center = true
# Show what's playing (enso-play, when installed) under the clock while the
# pointer rests on it: a YouTube tab, Spotify, any MPRIS player.
now_playing = true
# How solid the islands are, from 0.0 to 1.0: a little under 1.0 lets the
# wallpaper show through, just. What sits on them stays solid.
opacity = 0.9

[launch]
width = 560
# Rows shown before the list scrolls.
max_results = 8
# Search files as well as applications.
files = true
# Directories whose files are searched; "~" is your home directory. A hidden
# directory named here is searched even with `hidden = false`, which is how
# ~/.config is included while the rest of the dotfiles stay out.
file_roots = ["~", "~/.config"]
# Include dotfiles and dot-directories.
hidden = false
# Honour .gitignore and .ignore files below the directory they are in,
# whether or not it is a Git repository. (The one directly in your home
# directory is skipped: that belongs to a dotfiles repository.)
gitignore = true
# Leave out what nobody searches for, by name: dependency trees and caches
# (node_modules, __pycache__, cache, …), compiler by-products (*.o, *.pyc, …),
# and build output where a project file gives it away — `target` beside a
# Cargo.toml, `dist` beside a package.json, `bin` beside a .csproj. A `bin`
# or `build` folder of your own, with no such file beside it, is searched.
default_ignores = true
# Your own list, with the last word over both of the above. A name or glob
# matches at any depth, a relative path matches the end of a path, and a
# path starting with "/" or "~" matches exactly that one. A leading "!"
# keeps something that would otherwise be left out:
# ignore = ["*.iso", "Music/incoming", "~/VMs", "!target"]
ignore = []

[files]
# Show dotfiles. Ctrl+H or "." toggles them in the window.
hidden = false
# Order folders by "name", "size", "modified", "created", or "extension".
sort = "name"
descending = false
# Folders before files, whatever the order.
folders_first = true
# Row height: "comfortable" or "compact".
density = "comfortable"
# "list", "grid" for thumbnails, or "columns" (the folder above, this one,
# and what's under the cursor). These are the defaults: Ctrl+1, Ctrl+2, and
# Ctrl+3, the sort menu, Ctrl+H, and the grid's zoom change only the folder
# you're in, which keeps its own view (~/.local/state/enso/views.toml).
view = "list"
# F2 with several things chosen renames them all at once: find and replace,
# numbering, a template, or $EDITOR. false renames the one under the cursor.
bulk_rename = true
# The client ID of your GitHub OAuth app, for signing in to GitHub (Settings →
# GitHub asks for it the first time). Make one at github.com/settings/developers
# → New OAuth App, with "Enable Device Flow" ticked. It's public, not a secret.
github_client_id = ""
# The same for GitLab (Settings → GitLab): your OAuth app's application ID, made
# at <your GitLab>/-/user_settings/applications with the api scope and
# "Confidential" unticked; and where your GitLab is, if not gitlab.com.
gitlab_client_id = ""
gitlab_host = "gitlab.com"

[notify]
width = 360
# Lifetime of notifications that do not set one, in milliseconds.
timeout_ms = 5000
# Toasts shown at once; more wait in a queue.
max_visible = 5
# Space between toasts.
gap = 10
# The history (`enso-notify history`, or a click on the bar's bell):
# notifications shown at once — the rest scroll — and how many are remembered.
history_rows = 5
history_size = 50
# Keep the history across restarts and logins (its words, in
# ~/.local/state/enso/notify/history.toml). false forgets it with the session.
history_keep = true
# Do not disturb: notifications go quietly to the history (the bell counts
# them) instead of showing; critical ones still show. The control center's
# Settings page switches it too.
do_not_disturb = false

[ctl]
width = 340
# The programs `enso-ctl theme set` takes the palette (and fonts, cursor) to,
# besides enso's own tools. One that is not installed is passed over; drop a
# name to have enso leave that program alone.
theme_targets = ["niri", "alacritty", "neovim", "gtk", "fonts", "cursor", "firefox", "qt", "flatpak"]

[wall]
# How a picture meets a screen of another shape: "cover" fills the screen
# and crops what does not fit; "contain" shows all of it on the theme's
# base colour.
fit = "cover"
# The picture for themes that have none of their own, and one per theme id.
# A picture chosen with `enso-wall set` wins over the one written here.
# With neither, the theme's base colour is the wallpaper.
# default = "~/Pictures/walls/quiet.jpg"
#
# [wall.themes]
# rose-pine-dawn = "~/Pictures/walls/morning.png"

[power]
# What the menu offers, left to right: "lock", "suspend", "logout" (leave
# Niri), "restart", "shutdown".
actions = ["lock", "logout", "restart", "shutdown"]
# Ask for a second press before logging out, restarting, or shutting down.
confirm = true
# What "lock" runs, with its arguments.
lock_command = ["enso-lock"]

[lock]
# The times below, and before_sleep, can also be chosen on the control
# center's Screen & sleep page; those choices are kept in
# ~/.local/state/enso/settings.toml and win over what's here.
# The large clock, and the line under it ("" for none). strftime formats.
clock = "%H:%M"
date = "%A, %-d %B"
# Show the theme's wallpaper — the one `enso-wall` shows — blurred behind the
# clock. false is the theme's base colour alone.
wallpaper = true
# Seconds without a key or the pointer before the screens are powered off.
# Any input brings them back. 0 leaves them on.
screen_off_after = 30
# Seconds without a key or the pointer before the machine is suspended.
# 0 never suspends.
suspend_after = 0
# Hold the machine in its low-power platform profile while it is locked, and
# put the previous one back on unlock. Programs keep running, slower. Needs
# the same permission as `enso-ctl profile` (contrib/90-enso-power-profile.rules);
# without it this does nothing.
power_saver = true
# `enso-lock watch`, started with the session, locks without being asked:
# after this many seconds without a key or the pointer (0 never; time a film
# or a call keeps the screen awake does not count) …
idle_after = 300
# … and just before the machine sleeps, so it never wakes unlocked.
before_sleep = true
