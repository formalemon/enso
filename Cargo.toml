[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/formalemon/enso"
authors = ["Anshul"]
license = "MIT"

[workspace.dependencies]
# Internal crates.
enso-core = { path = "crates/enso-core", version = "0.2.0" }
enso-sys = { path = "crates/enso-sys", version = "0.2.0" }
enso-fs = { path = "crates/enso-fs", version = "0.2.0" }
enso-ui = { path = "crates/enso-ui", version = "0.2.0" }
enso-scene = { path = "crates/enso-scene", version = "0.2.0" }

# Data & config.
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }

# CLI parsing (tiny, zero dependencies).
lexopt = "0.3"

# Wayland + event loop. Pure-Rust protocol implementation, no libwayland.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
calloop = "0.14"

# Keyboard: pure-Rust XKB implementation, no libxkbcommon.
kbvm = "0.2"

# Software rendering + text shaping, both pure Rust.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# JPEG decoding for wallpapers, pure Rust.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
# PNG decoding and encoding with text chunks, for thumbnails. Pure Rust;
# tiny-skia already builds on it.
png = "0.18"
# WebP and GIF thumbnails, pure Rust.
image-webp = "0.2"
gif = { version = "0.14", default-features = false, features = ["std"] }
# Archives, all pure Rust: zip with only its Rust deflate, tar, gzip,
# xz both ways, zstd and bzip2 to read.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rs = "0.3"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
bzip2-rs = "0.1"
# The keyring's encryption: authenticated encryption (XChaCha20-Poly1305),
# RustCrypto, pure Rust; the master key is sealed by systemd's credentials.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["std"] }
# HTTPS for GitHub's API (sign-in, repositories): rustls with Mozilla's
# roots built in; JSON through serde.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
# Content search and bulk rename, pure Rust.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }

# System interfaces.
niri-ipc = "26.4"
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }
# PulseAudio wire protocol in pure Rust; PipeWire serves it (pipewire-pulse).
pulseaudio = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rustix = { version = "1", features = ["fs", "process", "event", "rand"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The boot menu's picture is rendered while enso-boot builds: millions of
# rays, so it is optimised even in debug builds, where build scripts and
# what they use otherwise aren't.
[profile.dev.package.enso-scene]
opt-level = 3
